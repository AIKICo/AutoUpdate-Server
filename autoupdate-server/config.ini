# ==============================================================================
# فایل پیکربندی وب‌سرور AutoUpdate-Server ویژه AutoUpdater.NET
# ==============================================================================

# پورت شنود وب‌سرور (پورت‌های رایج: 8000, 80, 5000)
port = 8000

# مسیر ذخیره‌سازی فایل‌های به‌روزرسانی (فایل‌های نصبی zip/exe و کاتالوگ‌های xml/json)
updates_dir = ./updates

# مسیر رابط کاربری پنل مدیریت
webroot_dir = ./webroot

# اطلاعات ورود به پنل وب مدیریت (/admin)
admin_user = admin
admin_pass = admin123

# مسیر فایل لاگ سرور
logfile = autoupdate.log
