worker_processes auto;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # بهینه‌سازی‌های ویژه انتقال سریع فایل‌های حجیم
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # لاگ‌های دسترسی
    access_log  logs/access.log;

    # تنظیمات سرور به‌روزرسانی نرم‌افزار
    server {
        # پورت شنود وب‌سرور (در صورت تمایل به تغییر، این عدد را ویرایش کنید)
        listen       8080;
        server_name  localhost;

        # مسیر پوشه حاوی فایل‌های نصبی و کانفیگ‌ها
        root   updates;

        # فعال‌سازی نمایش فهرست فایل‌ها در مرورگر
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # سرآیند فعال‌سازی Resume در کلاینت AutoUpdater.NET
        add_header Accept-Ranges bytes always;

        # هدرهای CORS جهت دسترسی برنامه‌ها از سایر دامنه‌ها
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Authorization' always;

        # جلوگیری از کش شدن فایل‌های مانیفست نسخه
        location ~* \.(xml|json)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Accept-Ranges bytes always;
            add_header Access-Control-Allow-Origin * always;
        }

        # تنظیمات بهینه دانلود فایل‌های باینری نصبی
        location ~* \.(exe|zip|msi|7z|tar\.gz)$ {
            add_header Accept-Ranges bytes always;
            add_header Access-Control-Allow-Origin * always;
            # پشتیبانی از چندین اتصال همزمان
            limit_rate_after 10m;
        }

        # صفحه خطای سرور
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
